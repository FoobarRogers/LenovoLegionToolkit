name: Test Notification Opacity

on:
  push:
    branches:
      - test/notification-opacity
  workflow_dispatch:

concurrency:
  group: test-notification-opacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore LenovoLegionToolkit.sln

      - name: Publish LLT WPF
        run: dotnet publish LenovoLegionToolkit.WPF -c Release -o build-test2 /p:DebugType=None /p:FileVersion=2.36.0.0 /p:Version=2.36.0.0

      - name: Create patch payload
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path patch-payload | Out-Null
          Copy-Item "build-test2\Lenovo Legion Toolkit.dll" "patch-payload\"
          Copy-Item "build-test2\LenovoLegionToolkit.Lib.dll" "patch-payload\"

          @'
          @echo off
          setlocal
          set "TARGET=%ProgramFiles%\LenovoLegionToolkit"
          if not exist "%TARGET%\Lenovo Legion Toolkit.exe" (
            echo [ERROR] Lenovo Legion Toolkit was not found at:
            echo %TARGET%
            echo.
            echo Edit TARGET in this BAT if you installed LLT elsewhere.
            pause
            exit /b 1
          )

          taskkill /IM "Lenovo Legion Toolkit.exe" /F >nul 2>&1

          set "BACKUP=%TARGET%\backup-notification-opacity-test2"
          if not exist "%BACKUP%" mkdir "%BACKUP%"

          for %%F in ("Lenovo Legion Toolkit.dll") do (
            if exist "%TARGET%\%%~F" copy /Y "%TARGET%\%%~F" "%BACKUP%\%%~F" >nul
            copy /Y "%~dp0%%~F" "%TARGET%\%%~F" >nul || exit /b 1
          )

          echo.
          echo [OK] Notification opacity test2 patch applied.
          echo Backup: %BACKUP%
          pause
          '@ | Set-Content -Encoding ASCII "patch-payload\INSTALL_TEST2.bat"

          @'
          @echo off
          setlocal
          set "TARGET=%ProgramFiles%\LenovoLegionToolkit"
          set "BACKUP=%TARGET%\backup-notification-opacity-test2"

          if not exist "%BACKUP%" (
            echo [ERROR] Backup folder not found:
            echo %BACKUP%
            pause
            exit /b 1
          )

          taskkill /IM "Lenovo Legion Toolkit.exe" /F >nul 2>&1

          for %%F in ("Lenovo Legion Toolkit.dll") do (
            if exist "%BACKUP%\%%~F" copy /Y "%BACKUP%\%%~F" "%TARGET%\%%~F" >nul || exit /b 1
          )

          echo.
          echo [OK] Original files restored.
          pause
          '@ | Set-Content -Encoding ASCII "patch-payload\ROLLBACK_TEST2.bat"

          @'
          LLT Team 2.36.0 notification background opacity test2

          Base commit:
          6c86eb8afb76a124be9339e01fb7900df354765d

          Patch behavior:
          - Adds a global notification background opacity control (25% to 100%, 5% steps).
          - Applies to Caps Lock, Num Lock, Fn Lock, power mode and other LLT notification windows.
          - test2 changes only the notification background opacity; icon and text stay fully opaque.
          - FPS/CPU/GPU sensor OSD opacity is separate and unchanged.
          - Only Lenovo Legion Toolkit.dll is replaced. The official EXE and LenovoLegionToolkit.Lib.dll remain untouched.

          Install:
          1. Exit LLT.
          2. Run INSTALL_TEST2.bat as administrator.
          3. Start LLT and open notification settings.
          4. Set opacity to 50% for an obvious test.
          5. Press Caps Lock / Num Lock / Fn Lock.
          6. Verify Hardware Sensors still opens without assembly errors.

          Rollback:
          Run ROLLBACK_TEST2.bat as administrator.

          Default installer path:
          C:\Program Files\LenovoLegionToolkit
          '@ | Set-Content -Encoding UTF8 "patch-payload\README.txt"

          Compress-Archive -Path "patch-payload\*" -DestinationPath "LLT-Team-2.36.0-notification-opacity-test2-replace.zip" -Force

      - name: Upload full publish
        uses: actions/upload-artifact@v4
        with:
          name: llt-notification-opacity-test2-full
          path: build-test2

      - name: Upload replacement patch
        uses: actions/upload-artifact@v4
        with:
          name: llt-notification-opacity-test2-replace
          path: LLT-Team-2.36.0-notification-opacity-test2-replace.zip
